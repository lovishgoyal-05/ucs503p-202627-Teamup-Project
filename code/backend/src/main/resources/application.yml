spring:
  application:
    name: teamup-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/teamup}
    username: ${POSTGRES_USER:teamup}
    password: ${POSTGRES_PASSWORD:change-me-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
server:
  port: 8080
  forward-headers-strategy: framework
teamup:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt-secret: ${JWT_SECRET:local-development-secret-key-change-this-32bytes-minimum}
  cookie-secure: ${COOKIE_SECURE:false}
  refresh-cookie-name: ${REFRESH_COOKIE_NAME:teamup_refresh}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  refresh-inactivity-days: ${REFRESH_INACTIVITY_DAYS:7}
  absolute-session-days: ${ABSOLUTE_SESSION_DAYS:30}
  default-page-size: ${DEFAULT_PAGE_SIZE:20}
  max-page-size: ${MAX_PAGE_SIZE:100}
  notification-limit: ${NOTIFICATION_LIMIT:100}
  default-role: ${DEFAULT_ROLE:STUDENT}
  optional-skill-bonus-max: ${OPTIONAL_SKILL_BONUS_MAX:10}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
